name: Build & Test
on:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    branches:
      - 'main'
    paths-ignore:
      - 'README.md'
  schedule:
    - cron: '0 13 * * *'
  repository_dispatch:
    types: [deploy-success]

# The acceptance tests use a shared Checkly account. Runs on the same ref wait
# for each other instead of overlapping there, and a newer pending run replaces
# an older one. This holds back the build jobs of a new push too, while
# cancelling a running test leg would leave its resources behind in the
# account. The test job additionally queues behind the test jobs of every
# other ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    name: Go build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26'
      id: go
    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Get dependencies
      run: |
        go mod download
    - name: Build
      run: |
        go build -v .

  generate:
    name: Go generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: go generate ./...
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'go generate ./...' command and commit."; exit 1)

  # run acceptance tests in a matrix with Terraform core versions
  test:
    name: Matrix test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs on all refs share the account too, so their test legs wait for
    # each other in one queue. Without a queue, a newer pending leg would
    # cancel an older pending one.
    concurrency:
      group: checkly-acceptance-account
      queue: max
    strategy:
      # The legs share one Checkly account, so they run one at a time.
      max-parallel: 1
      # The shared account makes single tests flaky, which should not cancel
      # the remaining legs.
      fail-fast: false
      matrix:
        # The provider supports Terraform 1.8 or later, the oldest version
        # that can move resources between resource types.
        terraform:
          - '1.8.*'
          - '1.*'
    steps:
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26'
      id: go

    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ matrix.terraform }}
        terraform_wrapper: false

    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Get dependencies
      run: |
        go mod download

    - name: Set up gotestfmt
      uses: gotesttools/gotestfmt-action@eba2ac97f623e866e7b1b117c99f18b43cd36d18 # v2.3.0
      with:
        # Looking up the latest release without a token shares the runner
        # IP's GitHub API rate limit with other jobs.
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Mirror the SDK v2 provider release
      # The upgrade tests install the last SDK v2 release of the provider in
      # every subtest, and a single failed request to GitHub or the registry
      # fails that subtest. Downloading it once, with retries, into a local
      # mirror that Terraform must install it from keeps the tests off the
      # network for it.
      run: |
        set -euo pipefail
        version=$(sed -n 's/^const sdkv2ProviderVersion = "\(.*\)"$/\1/p' internal/provider/upgrade_sdkv2_test.go)
        test -n "$version"
        mirror="$RUNNER_TEMP/terraform-provider-mirror"
        dir="$mirror/registry.terraform.io/checkly/checkly"
        zip="terraform-provider-checkly_${version}_linux_amd64.zip"
        base="https://github.com/checkly/terraform-provider-checkly/releases/download/v${version}"
        mkdir -p "$dir"
        curl -fsSL --retry 10 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/SHA256SUMS" "$base/terraform-provider-checkly_${version}_SHA256SUMS"
        curl -fsSL --retry 10 --retry-all-errors --retry-delay 10 -o "$dir/$zip" "$base/$zip"
        (cd "$dir" && grep " $zip\$" "$RUNNER_TEMP/SHA256SUMS" | sha256sum -c -)
        cat > "$RUNNER_TEMP/terraform.tfrc" <<EOF
        provider_installation {
          filesystem_mirror {
            path    = "$mirror"
            include = ["registry.terraform.io/checkly/checkly"]
          }
          direct {
            exclude = ["registry.terraform.io/checkly/checkly"]
          }
        }
        EOF
        echo "TF_CLI_CONFIG_FILE=$RUNNER_TEMP/terraform.tfrc" >> "$GITHUB_ENV"

    - name: TF acceptance tests
      timeout-minutes: 10
      # Limit parallelism to 4 to avoid hitting Checkly API rate limits.
      # Use -json piped to tee + gotestfmt for real-time streaming output
      # in CI while also saving the raw log as an artifact.
      run: |
        set -euo pipefail
        go test -v -parallel 4 -json ./... 2>&1 | tee /tmp/gotest.log | gotestfmt
      env:
        TF_ACC: "1"
        TF_VAR_checkly_api_key: ${{ secrets.CHECKLY_API_KEY }}
        TF_VAR_checkly_account_id: ${{ secrets.CHECKLY_ACCOUNT_ID }}
        CHECKLY_ACCOUNT_ID: ${{ secrets.CHECKLY_ACCOUNT_ID }}
        CHECKLY_API_URL: ${{ secrets.CHECKLY_API_URL }}
        CHECKLY_API_KEY: ${{ secrets.CHECKLY_API_KEY }}

    - name: Sanitize artifact name
      id: artifact-name
      if: always()
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        result-encoding: string
        script: |
          const tf = '${{ matrix.terraform }}'.replace('.*', '.x')
          return `test-log-tf-${tf}`

    - name: Upload test log
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: ${{ steps.artifact-name.outputs.result }}
        path: /tmp/gotest.log
        if-no-files-found: error
